name: CI
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "package.json", "package-lock.json", "tsconfig.json", "biome.json", "tsup.config.ts", "vitest.config.ts", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "package.json", "package-lock.json", "tsconfig.json", "biome.json", "tsup.config.ts", "vitest.config.ts", ".github/workflows/ci.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite (the default SQLite driver) is flagged on 22.x, stable on 24.x.
        include:
          - node: "22"
            node_options: "--experimental-sqlite"
          - node: "24"
            node_options: ""
    name: node ${{ matrix.node }}
    env:
      NODE_OPTIONS: ${{ matrix.node_options }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (biome)
        run: npm run lint
      - name: Type-check (tsc --noEmit)
        run: npm run test:types
      - name: Tests (vitest — runtime + type tests)
        run: npm test
      - name: Build (tsup → ESM + CJS + d.ts)
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    name: postgres integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tdbjs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: PostgreSQL integration tests (real database)
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/tdbjs
        run: npx vitest run tests/postgres.integration.test.ts tests/postgres-gaps.integration.test.ts tests/postgres-cli.integration.test.ts

  mysql:
    runs-on: ubuntu-latest
    name: mysql integration
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tdbjs
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: MySQL integration tests (real database)
        env:
          TEST_MYSQL_URL: mysql://root:test@localhost:3306/tdbjs
        run: npx vitest run tests/mysql.integration.test.ts
